<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风车模型预览</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e6dc; font-family: "Songti SC", "Noto Serif SC", serif; }
  canvas { display: block; }
  #note { position: fixed; left: 0; right: 0; bottom: 22px; text-align: center; color: #5a5650; font-size: 14px; letter-spacing: 3px; pointer-events: none; }
</style>
</head>
<body>
<div id="note">拖动查看各个角度　·　按住鼠标，风会变大</div>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- the pinwheel
// Made the way a paper pinwheel is made: a square of paper, cut from each corner along the diagonals
// toward the centre, and one corner of each of the four triangles folded in to the centre and pinned.
// So from the front it reads as a four-pointed star: each vane keeps one sharp corner pointing outward,
// flat, while its other half rolls round in a smooth cone back in to the pin. The paper is coloured
// right through, with a soft sheen, and the surfaces are smooth, not faceted.
const A = 0.62;                                                // half the side of the paper square
const VANES = ['#ef5a2a', '#2c6fe0', '#33b84a', '#f6cf24'];     // orange, blue, green, yellow, round the wheel
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function vaneGeometry() {
  // the triangle from the centre to two neighbouring corners of the square: w = 0 at the corner that stays flat
  // and points out, w = 1 at the corner that is folded in to the pin
  const C0 = [A, A], C1 = [-A, A], NS = 28, NW = 24, pos = [], idx = [];
  for (let i = 0; i <= NS; i++) for (let j = 0; j <= NW; j++) {
    const s = i / NS, w = j / NW;
    let x = s * (C0[0] + w * (C1[0] - C0[0])), y = s * (C0[1] + w * (C1[1] - C0[1]));
    const f = s * smooth(0.2, 1, w);                           // how far this bit of paper is rolled over
    const a = f * Math.PI * 0.95;                              // roll it round a cone whose tip is at the pin:
    const k = 1 - 0.9 * Math.pow(f, 1.25);                     //   drawn in toward the centre as it goes...
    x *= k; y *= k;
    const z = 0.5 * A * Math.sin(a) * (0.35 + 0.65 * s);      //   ...and bulging out toward the front
    pos.push(x, y, z);
  }
  for (let i = 0; i < NS; i++) for (let j = 0; j < NW; j++) {
    const a = i * (NW + 1) + j, b = a + 1, c = a + NW + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  g.computeVertexNormals();                                    // smooth shading across the curve
  return g;
}
const paper = VANES.map(c => new THREE.MeshPhongMaterial({ color: c, side: THREE.DoubleSide, shininess: 28, specular: 0x2a2a2a }));
const wood = new THREE.MeshPhongMaterial({ color: 0xd9a874, shininess: 18, specular: 0x1c1c1c });
const bead = new THREE.MeshPhongMaterial({ color: 0xe0b07a, shininess: 40, specular: 0x333333 });
function makePinwheel() {
  const g = new THREE.Group();
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.034, 1.6, 20), wood); stick.position.y = 0.8; g.add(stick);
  const wheel = new THREE.Group(); wheel.position.set(0, 1.5, 0.08); g.add(wheel);
  VANES.forEach((_, i) => wheel.add(new THREE.Mesh(vaneGeometry().rotateZ(-i * Math.PI / 2), paper[i])));
  const front = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 14), bead); front.position.z = 0.05; wheel.add(front);   // wooden bead on the pin
  const back = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), bead); back.position.z = -0.05; wheel.add(back);
  return { g, wheel };
}

// ---------------------------------------------------------------- preview stage
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xe9e6dc); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.35, 3.6); camera.lookAt(0, 1.2, 0);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
scene.add(new THREE.HemisphereLight(0xf2f0ea, 0x8a8270, 1.5));
const sun = new THREE.DirectionalLight(0xfff3df, 2.0); sun.position.set(-2, 4, 3); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(3, 48).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd8d2c2 }));
scene.add(ground);
const pw = makePinwheel(); scene.add(pw.g);

let yaw = 0.35, dragging = false, lastX = 0, blowing = false, spin = 1.2;
addEventListener('pointerdown', e => { dragging = true; blowing = true; lastX = e.clientX; });
addEventListener('pointerup', () => { dragging = false; blowing = false; });
addEventListener('pointermove', e => { if (dragging) { yaw += (e.clientX - lastX) * 0.01; lastX = e.clientX; } });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  spin += ((blowing ? 9 : 1.4) - spin) * Math.min(1, dt * 1.5);
  pw.wheel.rotation.z -= spin * dt;
  pw.g.rotation.y = yaw;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
