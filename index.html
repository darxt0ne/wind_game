<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>风物</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe2dc; }
  body { font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif; color: #3a3d3a; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(30,30,25,0.28) 100%); }
  #season { position: fixed; top: 36px; right: 40px; writing-mode: vertical-rl; font-size: 34px; letter-spacing: 10px;
    opacity: 0; transition: opacity 2s, color 3s; text-shadow: 0 0 12px rgba(255,255,255,0.4); }
  #season small { font-size: 14px; letter-spacing: 4px; margin-top: 14px; opacity: 0.7; }
  #line { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: 26px; line-height: 2.1; letter-spacing: 4px;
    opacity: 0; transition: opacity 1.6s, color 3s; pointer-events: none; white-space: pre-line;
    text-shadow: 0 0 18px rgba(255,255,255,0.55); }
  #line.show { opacity: 1; }
  #hint { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 16px; letter-spacing: 3px;
    opacity: 0; transition: opacity 1.6s, color 3s; pointer-events: none; }
  #hint.show { opacity: 0.75; }
  #dots { position: fixed; left: 0; right: 0; bottom: 36px; text-align: center; pointer-events: none; opacity: 0; transition: opacity 1.6s; }
  #dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 6px;
    border: 1px solid currentColor; opacity: 0.6; transition: background 0.6s, opacity 0.6s; }
  #dots span.on { background: currentColor; opacity: 0.95; }
  #edge { position: fixed; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.4) 45%, rgba(255,255,255,0) 72%);
    box-shadow: 0 0 14px rgba(255,255,255,0.8); opacity: 0; transition: opacity 0.5s; }
  #ending { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #ece5d3; pointer-events: none; cursor: pointer; text-shadow: 0 0 16px rgba(10,14,30,0.7); }
  #ending::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 4s ease;
    background: radial-gradient(ellipse 46% 52% at 50% 50%, rgba(8,12,26,0.55), rgba(8,12,26,0)); }
  #ending.shade::before { opacity: 1; }
  #ending > * { position: relative; opacity: 0; transform: translateY(6px); transition: opacity 2.6s ease, transform 2.6s ease; }
  #ending > .on { opacity: 1; transform: none; }
  #ending p { margin: 0; font-size: 24px; line-height: 2.1; letter-spacing: 5px; }
  #ending p.gap { margin-top: 1.6em; }
  #ending h2 { margin: 2.2em 0 0 18px; font-size: 56px; font-weight: normal; letter-spacing: 18px; color: #f2ecdc; }
  #ending .again { margin-top: 2.6em; font-size: 14px; letter-spacing: 6px; }
  #ending .again.on { opacity: 0.6; }
  @media (max-width: 700px) { #ending p { font-size: 18px; } #ending h2 { font-size: 42px; } }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(232,230,222,0.55); transition: opacity 2s; cursor: pointer; }
  #title h1 { font-size: 72px; font-weight: normal; letter-spacing: 28px; margin: 0 0 10px 28px; color: #2f322f; }
  #title .sub { font-size: 20px; letter-spacing: 8px; margin-bottom: 56px; opacity: 0.8; }
  #title .how { font-size: 14px; letter-spacing: 2px; line-height: 2.2; text-align: center; opacity: 0.65; }
  #title .go { margin-top: 40px; font-size: 16px; letter-spacing: 6px; animation: breathe 2.6s ease-in-out infinite; }
  #title.hide { opacity: 0; pointer-events: none; }
  @keyframes breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 0.9; } }
  @media (max-width: 700px) {
    #title h1 { font-size: 52px; } #line { font-size: 20px; } #season { font-size: 26px; right: 20px; top: 20px; }
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="ending">
  <p>他说，风一来，春天就来了。</p>
  <p class="gap">风是看不见的。</p>
  <p>可万物都记得它来过。</p>
  <h2>风物</h2>
  <div class="again">点击重新开始</div>
</div>
<div id="season"></div>
<div id="line"></div>
<div id="hint"></div>
<div id="dots"></div>
<div id="edge"></div>
<div id="title">
  <h1>风物</h1>
  <div class="sub">&nbsp;</div>
  <div class="how">移动鼠标 / 手指，决定风往哪里吹<br>按住鼠标或空格，吹得更快<br>建议戴上耳机</div>
  <div class="go">点击开始</div>
</div>

<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- helpers
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 7;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

function hash(x, y) {

  h = Math.imul(h ^ (h >>> 13), 1274126177);

}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);

function fbm(x, y) {

  for (let i = 0; i < 5; i++) { s += amp * vnoise(x * f, y * f); f *= 2.03; amp *= 0.5; }
  return s;
}
const riverX = z => 70 * Math.sin(z * 0.0055) + 25 * Math.sin(z * 0.017 + 1.3);
function slopeH(x, z) {
  const d = Math.abs(x - riverX(z));
  const r = Math.hypot(x, z);
  const n = fbm(x * 0.0042 + 10, z * 0.0042 - 4);
  const ridge = 1 - Math.abs(fbm(x * 0.0021 + 3, z * 0.0021 + 8) * 2 - 1);
  let h = 7 + (n * 120 + ridge * 60 - 40) * smooth(20, 190, d);
  h = Math.max(h, 7 + n * 6);
  h += smooth(420, 760, r) * 150;
  h -= (1 - smooth(6, 26, d)) * 9;
  return h;
}
// the ground under the old tree at the edge of the village is levelled into a small yard,
// easing back into the hillside at its edge (the tree stands at riverX(138) + 28, z = 138)
const YARD_X = riverX(160) + 28, YARD_Z = 138, YARD_H = slopeH(YARD_X, YARD_Z);
function H(x, z) {
  const h = slopeH(x, z), d = Math.hypot(x - YARD_X, z - YARD_Z);
  return d > 30 ? h : lerp(YARD_H, h, smooth(15, 30, d));
}
const WATER = 2.5;

function softTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const SOFT = softTexture();

// ---------------------------------------------------------------- palettes
const C = h => new THREE.Color(h);
const PALETTES = {
  spring: { skyTop: C('#a7bccb'), skyHor: C('#ece8dc'), fog: C('#e1e3dc'), grass: C('#a6b182'), rock: C('#80857f'),
    snow: C('#f1f1ec'), sand: C('#cfc8b2'), water: C('#9ab7b8'), tree: C('#76a05e'), treeBare: C('#80746a'),
    blossom: C('#e9b9c3'), blossomAmt: 0.55, sun: C('#fff3df'), sunI: 2.2, hemiSky: C('#e8eef0'), hemiGround: C('#8a8270'), hemiI: 1.4,
    cloud: C('#ffffff'), cloudO: 0.75, ink: C('#3a3d3a'), window: C('#4a4a46'), stars: 0, glow: C('#ffffff'), roof: C('#4c535c'), pine: C('#5f8059') },
  qingming: { skyTop: C('#86abc8'), skyHor: C('#f0f1e7'), fog: C('#e3ebe1'), grass: C('#7ea764'), rock: C('#717c74'),
    snow: C('#e8ece6'), sand: C('#c9c6ad'), water: C('#76a8ac'), tree: C('#558d4c'), treeBare: C('#558d4c'),
    blossom: C('#f0b7c4'), blossomAmt: 0.8, sun: C('#fff6e6'), sunI: 2.5, hemiSky: C('#eef4f2'), hemiGround: C('#7a8a64'), hemiI: 1.5,
    cloud: C('#ffffff'), cloudO: 0.85, ink: C('#334036'), window: C('#4a4a46'), stars: 0, glow: C('#fffbe8'), roof: C('#4a525b'), pine: C('#4a7a4b') },
  summer: { skyTop: C('#6c9fcf'), skyHor: C('#eef2e8'), fog: C('#e2ebe4'), grass: C('#78a457'), rock: C('#6f7a70'),
    snow: C('#e8ece6'), sand: C('#cfc6a6'), water: C('#5f9fa8'), tree: C('#3f7d3f'), treeBare: C('#3f7d3f'),
    blossom: C('#4f8a44'), blossomAmt: 0.3, sun: C('#fff1d6'), sunI: 2.8, hemiSky: C('#eef4f0'), hemiGround: C('#6f8a58'), hemiI: 1.5,
    cloud: C('#ffffff'), cloudO: 0.9, ink: C('#2f3d33'), window: C('#4a4a46'), stars: 0, glow: C('#fffbe8'), roof: C('#4a525b'), pine: C('#3f6e45') },
  autumn: { skyTop: C('#8fa9c0'), skyHor: C('#f1e6d2'), fog: C('#e9dfcd'), grass: C('#b5a868'), rock: C('#7c7668'),
    snow: C('#ece8df'), sand: C('#d6c8a2'), water: C('#7f9fa3'), tree: C('#cf8a3c'), treeBare: C('#cf8a3c'),
    blossom: C('#b8463a'), blossomAmt: 0.75, sun: C('#ffe2b8'), sunI: 2.4, hemiSky: C('#f1e8da'), hemiGround: C('#8a7354'), hemiI: 1.4,
    cloud: C('#fff6ea'), cloudO: 0.8, ink: C('#45392c'), window: C('#4a4a46'), stars: 0, glow: C('#fff3dc'), roof: C('#4c5058'), pine: C('#4f6e4b') },
  winter: { skyTop: C('#0a1430'), skyHor: C('#2c3958'), fog: C('#1f2a46'), grass: C('#b8c3d6'), rock: C('#4f5870'),
    snow: C('#dfe6f2'), sand: C('#aab4c8'), water: C('#33445f'), tree: C('#2d4349'), treeBare: C('#2d4349'),
    blossom: C('#c9d4e6'), blossomAmt: 0.5, sun: C('#9fb4e0'), sunI: 0.9, hemiSky: C('#506489'), hemiGround: C('#1a2236'), hemiI: 0.9,
    cloud: C('#53607e'), cloudO: 0.45, ink: C('#e6e1d2'), window: C('#ffb45e'), stars: 1, glow: C('#dfe9ff'), roof: C('#b9c4d6'), pine: C('#3c5a58') },
};
PALETTES.deep = { ...PALETTES.winter, skyTop: C('#060b1a'), skyHor: C('#1a2238'), fog: C('#141a2c'), sunI: 0.6, hemiI: 0.75,
  window: C('#b07a44'), cloudO: 0.3, glow: C('#cfdcf5') };
PALETTES.dawn = { ...PALETTES.spring, skyTop: C('#7d8fb8'), skyHor: C('#f2cbb0'), fog: C('#e3cfc4'), grass: C('#b4b9ad'), sun: C('#ffcfa0'),
  sunI: 1.4, hemiI: 1.1, cloud: C('#f6d9cc'), stars: 0.15 };
function blendPal(a, b, t) {
  const o = {};
  for (const k in a) o[k] = a[k].isColor ? a[k].clone().lerp(b[k], t) : lerp(a[k], b[k], t);
  return o;
}
let pal = blendPal(PALETTES.spring, PALETTES.spring, 0);

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(pal.fog.clone(), 60, 820);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 3000);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hemi = new THREE.HemisphereLight(0xffffff, 0x888888, 1.4); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2); scene.add(sun); scene.add(sun.target);
const SUN_DIR = new THREE.Vector3(-0.55, 0.75, 0.38).normalize();
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -170, right: 170, top: 170, bottom: -170, near: 1, far: 1000 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.6;

// sky dome
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: pal.skyTop.clone() }, hor: { value: pal.skyHor.clone() } },
  vertexShader: `varying vec3 vW; void main(){ vW = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 hor; varying vec3 vW;
    void main(){ float h = normalize(vW - cameraPosition).y; float t = pow(smoothstep(-0.08, 0.65, h), 0.85);
      gl_FragColor = vec4(mix(hor, top, t), 1.);
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat); scene.add(sky);

// stars
const starGeo = new THREE.BufferGeometry(); {
  const p = [];
  for (let i = 0; i < 1400; i++) {
    const th = rand() * Math.PI * 2, ph = Math.acos(rand() * 0.95);
    p.push(Math.sin(ph) * Math.cos(th) * 1400, Math.cos(ph) * 1400 + 40, Math.sin(ph) * Math.sin(th) * 1400);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
const stars = new THREE.Points(starGeo, starMat); scene.add(stars);

// terrain
const SIZE = 1700, SEG = 230;
const tGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG); tGeo.rotateX(-Math.PI / 2);
const tPos = tGeo.attributes.position;
for (let i = 0; i < tPos.count; i++) tPos.setY(i, H(tPos.getX(i), tPos.getZ(i)));
tGeo.computeVertexNormals();
const tCol = new Float32Array(tPos.count * 3);
tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
const tVar = new Float32Array(tPos.count).map((_, i) => 0.93 + hash(i, 99) * 0.1);
const terrain = new THREE.Mesh(tGeo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
terrain.receiveShadow = true;
scene.add(terrain);
const _c = new THREE.Color();
let tForest = null; const _c2 = new THREE.Color();
function paintTerrain() {
  const nrm = tGeo.attributes.normal;
  for (let i = 0; i < tPos.count; i++) {
    const y = tPos.getY(i), slope = 1 - nrm.getY(i);
    _c.copy(pal.grass);
    if (y < WATER + 2.5) _c.lerp(pal.sand, 1 - smooth(WATER, WATER + 2.5, y));
    _c.lerp(pal.rock, clamp(smooth(0.22, 0.48, slope) + smooth(60, 110, y) * 0.6, 0, 1));
    _c.lerp(pal.snow, smooth(115, 160, y));
    if (tForest) _c.lerp(_c2.copy(pal.pine).multiplyScalar(0.8), tForest[i] * 0.32);
    const v = tVar[i];
    tCol[i * 3] = _c.r * v; tCol[i * 3 + 1] = _c.g * v; tCol[i * 3 + 2] = _c.b * v;
  }
  tGeo.attributes.color.needsUpdate = true;
}

const waterTime = { value: 0 };
const waterMat = new THREE.MeshPhongMaterial({ color: pal.water.clone(), transparent: true, opacity: 0.86, flatShading: true,
  shininess: 60, specular: 0x4a4a46, depthWrite: false });
waterMat.onBeforeCompile = sh => {
  sh.uniforms.uTime = waterTime;
  sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>',
    `vec3 transformed = vec3(position); vec4 wp0 = modelMatrix * vec4(position, 1.);
     transformed.z += (sin(wp0.x * 0.16 + uTime * 1.1) + cos(wp0.z * 0.13 + uTime * 0.8) + sin((wp0.x + wp0.z) * 0.31 + uTime * 1.7) * 0.5) * 0.16;`);
};
const water = new THREE.Mesh(new THREE.PlaneGeometry(1300, 1300, 200, 200), waterMat);
water.rotation.x = -Math.PI / 2; water.position.y = WATER; water.renderOrder = -1; water.receiveShadow = true; scene.add(water);

// ---- small geometry kit: bake a flat vertex colour into each part, then merge parts into one mesh
function bake(geo, color) {

  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  const c = new THREE.Color(color), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}
function part(geo, color, [x = 0, y = 0, z = 0] = [], [rx = 0, ry = 0, rz = 0] = [], [sx = 1, sy = sx, sz = sx] = []) {
  geo.scale(sx, sy, sz); geo.rotateZ(rz); geo.rotateX(rx); geo.rotateY(ry); geo.translate(x, y, z);
  return bake(geo, color);
}
function merge(list) {
  let n = 0; list.forEach(g => n += g.attributes.position.count);
  const out = new THREE.BufferGeometry();
  for (const k of ['position', 'normal', 'color']) {
    const arr = new Float32Array(n * 3); let o = 0;
    list.forEach(g => { arr.set(g.attributes[k].array, o); o += g.attributes[k].array.length; });
    out.setAttribute(k, new THREE.BufferAttribute(arr, 3));
  }
  out.computeBoundingSphere(); return out;
}
const kitMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const BOX = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const CYL = (a, b, h, n = 6) => new THREE.CylinderGeometry(a, b, h, n);
const ICO = r => new THREE.IcosahedronGeometry(r, 0);

// trees: grown in groves, not sprinkled.
// Low-frequency noise marks where forest wants to be; each grove picks its species from altitude
// (broadleaf low in the valley, pine up on the slopes), big trees in the middle thinning out at the edge.
const VZ = 160, VX = riverX(VZ) + 58;
const OLD = { x: VX - 30, z: VZ - 22 }; OLD.y = H(OLD.x, OLD.z);
const trees = [], groves = [];
const grid = new Map(), CELL = 8;
const forestN = (x, z) => fbm(x * 0.0055 + 50, z * 0.0055 - 30);
function canPlant(x, z, minD) {
  const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const l = grid.get((cx + i) + ',' + (cz + j)); if (!l) continue;
    for (const t of l) if ((t.x - x) ** 2 + (t.z - z) ** 2 < minD * minD) return false;
  }
  return true;
}
function plant(t) {
  t.ry = rand() * 6.28; t.lx = (rand() - 0.5) * 0.08; t.lz = (rand() - 0.5) * 0.08; t.g = 0; t.gT = 0;
  trees.push(t); const k = Math.floor(t.x / CELL) + ',' + Math.floor(t.z / CELL);
  (grid.get(k) || grid.set(k, []).get(k)).push(t);
}
function groundOK(x, z, maxSlope = 4) {
  const y = H(x, z);
  if (y < WATER + 1.5 || y > 115) return null;
  if (Math.abs(H(x + 3, z) - y) + Math.abs(H(x, z + 3) - y) > maxSlope) return null;
  return y;
}
const gauss = () => (rand() + rand() + rand() - 1.5) / 1.5;
// 1. village first, so groves leave room for it
{
  // the old tree at the village entrance
  const ox = OLD.x, oz = OLD.z, oy = OLD.y;
  plant({ x: ox, y: oy, z: oz, s: 3.1, type: 'leaf', blossom: false });
  // a small orchard of blossoming fruit trees in loose rows
  const oa = 0.4, cx = VX + 52, cz = VZ + 30;
  for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
    const u = (i - 2) * 9 + gauss() * 1.2, v = (j - 2) * 9 + gauss() * 1.2;
    const x = cx + u * Math.cos(oa) - v * Math.sin(oa), z = cz + u * Math.sin(oa) + v * Math.cos(oa);
    const y = groundOK(x, z, 5); if (y === null || !canPlant(x, z, 6)) continue;
    plant({ x, y, z, s: 0.95 + rand() * 0.2, type: 'leaf', blossom: true, orchard: true });
  }
}
const nearVillage = (x, z) => Math.hypot(x - VX, z - VZ) < 62;
// 2. groves
for (let tries = 0; groves.length < 42 && tries < 6000; tries++) {
  const x = (rand() - 0.5) * 1150, z = (rand() - 0.5) * 1150;
  const f = forestN(x, z); if (f < 0.55) continue;

    arms: [[[0.34, 1.74, 0], [0.44, 1.3, 0.3], [0.4, 0.98, 0.7]], [[-0.34, 1.74, 0], [-0.44, 1.3, 0.3], [-0.4, 0.98, 0.7]]] })));

  if (player.pos.y < ground) player.pos.y = ground;
  if (player.pos.y > 260) player.pos.y = lerp(player.pos.y, 260, dt * 2);

  glowFade = lerp(glowFade, glowTarget, Math.min(1, dt * (glowTarget > glowFade ? 0.9 : 0.35)));
  glowMat.opacity = glowFade; trailMat.uniforms.fade.value = glowFade * (0.25 + 0.75 * vk);
  glow.position.copy(player.pos);
  glow.scale.setScalar((3.2 + Math.sin(now * 3) * 0.3) * (0.45 + 0.55 * vk));
  motes.forEach(o => {
    const a = now * o.sp + o.ph;
    const r = o.r * (0.5 + 0.5 * vk);
    o.m.position.copy(player.pos).add(tmp.set(Math.cos(a) * r, Math.sin(a * 1.3) * r * 0.6 - (1 - glowFade) * 3, Math.sin(a) * r));
  });
  const focus = cine ? camLook : player.pos;
  sun.position.copy(focus).addScaledVector(SUN_DIR, 400); sun.target.position.copy(focus);

  // the family: she looks around when the wind passes, but never at it
  if (famGirl.visible) {
    girlReactCD -= dt;
    if (state !== 'prologue' && glowFade > 0.5 && girlReactCD <= 0 && player.pos.distanceTo(famGirl.position) < 14) { girlReact = 2.6; girlReactCD = 7; }
    if (girlRun) {
      girlRun.t = Math.min(1, girlRun.t + dt * (girlRun.rate || 0.22));
      famGirl.position.lerpVectors(girlRun.from, girlRun.to, girlRun.t);
      famGirl.position.y = H(famGirl.position.x, famGirl.position.z) + (girlRun.walk ? Math.abs(Math.sin(now * 5)) * 0.06 : Math.abs(Math.sin(now * 9)) * 0.25) * (girlRun.t < 1 ? 1 : 0);
      famGirl.rotation.y = Math.atan2(girlRun.to.x - girlRun.from.x, girlRun.to.z - girlRun.from.z);
    } else if (girlReact > 0) {
      girlReact -= dt;
      const away = Math.atan2(player.pos.x - famGirl.position.x, player.pos.z - famGirl.position.z) + Math.PI;
      famGirl.rotation.y = lerp(famGirl.rotation.y, away + Math.sin(girlReact * 2.4) * 0.8, Math.min(1, dt * 3));
    } else famGirl.rotation.y = lerp(famGirl.rotation.y, girlYaw, Math.min(1, dt * 1.5));
  }
  if (state === 'meet' && !pinDone) { pin.wheel.getWorldPosition(_v); if (player.pos.distanceTo(_v) < 8) onPinwheel(); }
  if (state === 'meet' && !pinDone && cine && !cine.follow && player.pos.distanceTo(camPos) > 26) cine = null; // wandered off: follow the wind
  if (pinDone) pin.target = player.pos.distanceTo(famGirl.position) < 22 ? 1 : 0.12;
  // the pinwheel on his stool turns whenever the wind passes, and keeps turning once she has let go
  if (stoolPin.g.visible) stoolPin.target = state === 'finale' || state === 'end' || player.pos.distanceTo(FAM.stool) < 15 ? 1 : 0;
  for (const pw of [pin, stoolPin]) { pw.spin = lerp(pw.spin, pw.target, Math.min(1, dt * 0.8)); pw.wheel.rotation.z -= pw.spin * dt * 9; }
  waterTime.value = now;
  trailPts.pop(); trailPts.unshift(player.pos.clone().add(tmp.set(Math.sin(now * 7) * 0.4, Math.cos(now * 5) * 0.4, 0)));
  const tp = trailGeo.attributes.position;
  trailPts.forEach((p, i) => tp.setXYZ(i, p.x, p.y, p.z)); tp.needsUpdate = true;
  trailMat.uniforms.scale.value = innerHeight;

  // camera
  if (cine && cine.follow) {
    _v.copy(cine.follow.position).add(cine.off); _v.y = Math.min(_v.y, cine.maxY);
    _v.y = Math.max(_v.y, Math.max(H(_v.x, _v.z), WATER) + 3);
    cine.pos = cine.pos || _v.clone(); cine.look = cine.look || cine.follow.position.clone();
    cine.pos.lerp(_v, 1 - Math.exp(-dt * cine.k)); cine.look.lerp(cine.follow.position, 1 - Math.exp(-dt * 2));
  }
  if (gpLook && famGrandpa.visible) {
    const want = Math.atan2(player.pos.x - famGrandpa.position.x, player.pos.z - famGrandpa.position.z);
    famGrandpa.rotation.y += Math.atan2(Math.sin(want - famGrandpa.rotation.y), Math.cos(want - famGrandpa.rotation.y)) * Math.min(1, dt * 0.8);
  }
  if (cine) {
    const k = 1 - Math.exp(-dt * cine.k);
    camPos.lerp(cine.pos, k); camLook.lerp(cine.look, k);
    camera.position.copy(camPos); camera.lookAt(camLook);
  } else {
    const back = tmp.copy(fwd).setY(fwd.y * 0.5).normalize();
    const near = state === 'meet' ? 0.55 : 1;
    const desired = new THREE.Vector3().copy(player.pos).addScaledVector(back, -17 * near).add(new THREE.Vector3(0, 5.5 * near, 0));
    camPos.lerp(desired, 1 - Math.exp(-dt * 3.2));
    const cg = Math.max(H(camPos.x, camPos.z), WATER) + 2.5;
    if (camPos.y < cg) camPos.y = cg;
    camera.position.copy(camPos);
    camLook.set(player.pos.x + fwd.x * 12, player.pos.y + fwd.y * 12 + 1, player.pos.z + fwd.z * 12);
    camera.lookAt(camLook);
    camera.rotateZ(player.yawRate * 0.12);
  }
  camera.fov = lerp(camera.fov, 60 + (player.speed - 28) * 0.25, dt * 2); camera.updateProjectionMatrix();
  sky.position.copy(camera.position); stars.position.copy(camera.position);

  // clouds drift
  clouds.forEach(c => { c.position.x += dt * 3; if (c.position.x > 750) c.position.x -= 1500; });

  // particles
  pMat.color.lerp(pMode.color, dt); pMat.size = lerp(pMat.size, pMode.size, dt);
  pMat.opacity = lerp(pMat.opacity, active ? pMode.opacity : 0, dt);
  const pc = cine ? camPos : player.pos;
  for (let i = 0; i < PN; i++) {
    let x = pArr[i * 3], y = pArr[i * 3 + 1], z = pArr[i * 3 + 2];
    y -= pMode.fall * dt; x += Math.sin(now * 0.5 + i) * pMode.drift * dt; z += Math.cos(now * 0.4 + i * 1.3) * pMode.drift * dt;
    const h = PBOX / 2;
    x = ((x - pc.x + h) % PBOX + PBOX) % PBOX - h + pc.x;
    y = ((y - pc.y + h) % PBOX + PBOX) % PBOX - h + pc.y;
    z = ((z - pc.z + h) % PBOX + PBOX) % PBOX - h + pc.z;
    pArr[i * 3] = x; pArr[i * 3 + 1] = y; pArr[i * 3 + 2] = z;
  }
  pGeo.attributes.position.needsUpdate = true;

  // targets
  let nearest = null, nd = Infinity;
  targets.forEach(t => {
    t.update(dt);
    if (t.done) { t.beacon.material.opacity = Math.max(0, t.beacon.material.opacity - dt); return; }
    t.beacon.scale.setScalar(7 + Math.sin(now * 2.2 + t.pos.x) * 1.6);
    const d = player.pos.distanceTo(t.pos);
    if (d < nd) { nd = d; nearest = t; }
    if (state === 'play' && d < t.radius) {
      t.done = true; t.onTouch();
      const n = targets.filter(x => x.done).length;
      sound.chime(n - 1);
      if (!lastPhase) setDots(targets.length, n);
      if (n === targets.length) finishChapter();
    }
  });
  extras.forEach(f => f(dt));

  // edge indicator toward nearest remaining target
  if (nearest && state === 'play') {
    const p = tmp.copy(nearest.pos).project(camera);
    const behind = p.z > 1;
    let x = behind ? -p.x : p.x, y = behind ? -p.y : p.y;
    const onScreen = !behind && Math.abs(x) < 0.92 && Math.abs(y) < 0.92;
    if (onScreen) edge.style.opacity = 0;
    else {
      const m = Math.max(Math.abs(x), Math.abs(y)) || 1; x /= m; y /= m;
      edge.style.left = ((x * 0.9 + 1) / 2 * innerWidth) + 'px';
      edge.style.top = ((-y * 0.88 + 1) / 2 * innerHeight) + 'px';
      edge.style.opacity = 0.85;
    }
  } else edge.style.opacity = 0;

  if (lineTimer > 0) { lineTimer -= dt; if (lineTimer <= 0) $('line').classList.remove('show'); }
  sound.update(clamp((player.speed - 20) / 45, 0, 1));
}

function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

// debug hook for testing
window.__wind = { get now() { return now; }, get cine() { return cine; }, get pinDone() { return pinDone; }, FAM, OPENING, herWalk, peek: (from, at) => { cine = { pos: new THREE.Vector3(...from), look: new THREE.Vector3(...at), k: 40 }; }, unpeek: () => { cine = null; }, player, scene, get stage() { return stage; }, startChapter, lastLantern, famGirl, counts: () => ({ trees: trees.length, shrubs: shrubs.length, tufts: tufts.length }), get targets() { return targets; }, get state() { return state; }, get chapter() { return chapter; }, step };
</script>
